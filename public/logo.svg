<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="proGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="2" width="48" height="48" rx="13" fill="url(#iconGrad)"/>
  <!-- Glow overlay -->
  <rect x="0" y="2" width="48" height="48" rx="13" fill="white" opacity="0.06"/>

  <!-- Bar chart bars -->
  <rect x="8"  y="30" width="7" height="13" rx="2.5" fill="url(#barGrad)" opacity="0.85"/>
  <rect x="18" y="22" width="7" height="21" rx="2.5" fill="url(#barGrad)"/>
  <rect x="28" y="16" width="7" height="27" rx="2.5" fill="url(#barGrad)"/>

  <!-- Trending line -->
  <polyline points="11.5,28 21.5,19 31.5,13" stroke="#06d6a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Trend dot -->
  <circle cx="31.5" cy="13" r="2.5" fill="#06d6a0" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="60" y="33" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="20" letter-spacing="-0.3" fill="#f0f4ff">Ads</text>
  <text x="91" y="33" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="20" letter-spacing="-0.3" fill="#4f8ef7">Manager</text>

  <!-- PRO badge -->
  <rect x="174" y="17" width="38" height="20" rx="10" fill="url(#proGrad)"/>
  <text x="193" y="31" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="10.5" fill="white" text-anchor="middle" letter-spacing="1.5">PRO</text>
</svg>
